<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0a0a0a"/>
  
  <!-- Gradient circle -->
  <circle cx="900" cy="150" r="300" fill="url(#gradient)" opacity="0.15"/>
  <defs>
    <radialGradient id="gradient">
      <stop offset="0%" stop-color="#7F77DD"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </radialGradient>
  </defs>
  
  <!-- Line -->
  <line x1="100" y1="250" x2="180" y2="250" stroke="#7F77DD" stroke-width="2"/>
  
  <!-- Text -->
  <text x="100" y="300" font-family="monospace" font-size="24" fill="#7F77DD" letter-spacing="4">DESENVOLVEDOR</text>
  <text x="100" y="380" font-family="sans-serif" font-size="72" font-weight="800" fill="#f0f0f0">Mateus Serra</text>
  <text x="100" y="440" font-family="monospace" font-size="20" fill="#999999">Python · JavaScript · React Native · Flask</text>
  
  <!-- Status dot -->
  <circle cx="100" cy="520" r="8" fill="#1D9E75"/>
  <text x="120" y="528" font-family="monospace" font-size="18" fill="#1D9E75">disponível para projetos</text>
</svg>
