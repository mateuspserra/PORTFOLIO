<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0a0a0a"/>
  
  <!-- Gradient circle effect -->
  <circle cx="950" cy="200" r="350" fill="url(#gradient)" opacity="0.12"/>
  <defs>
    <radialGradient id="gradient">
      <stop offset="0%" stop-color="#7F77DD"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </radialGradient>
  </defs>
  
  <!-- Border -->
  <rect x="1" y="1" width="1198" height="628" rx="8" stroke="#222222" stroke-width="1" fill="none"/>
  
  <!-- Top line accent -->
  <line x1="80" y1="140" x2="160" y2="140" stroke="#7F77DD" stroke-width="2"/>
  
  <!-- Eyebrow text -->
  <text x="80" y="190" font-family="monospace" font-size="18" fill="#7F77DD" letter-spacing="6">DESENVOLVEDOR FULL-STACK</text>
  
  <!-- Main name -->
  <text x="80" y="280" font-family="sans-serif" font-size="80" font-weight="800" fill="#f0f0f0" letter-spacing="-2">Mateus</text>
  <text x="80" y="360" font-family="sans-serif" font-size="80" font-weight="800" fill="#7F77DD" letter-spacing="-2">Serra.</text>
  
  <!-- Tech stack -->
  <text x="80" y="420" font-family="monospace" font-size="20" fill="#999999">// Python · JavaScript · React Native · Flask</text>
  
  <!-- Stats -->
  <g transform="translate(80, 470)">
    <!-- Stat 1 -->
    <text x="0" y="30" font-family="sans-serif" font-size="32" font-weight="800" fill="#f0f0f0">1+</text>
    <text x="0" y="55" font-family="monospace" font-size="14" fill="#666666" letter-spacing="1">ANO DE EXP.</text>
    
    <!-- Stat 2 -->
    <text x="180" y="30" font-family="sans-serif" font-size="32" font-weight="800" fill="#f0f0f0">2</text>
    <text x="180" y="55" font-family="monospace" font-size="14" fill="#666666" letter-spacing="1">PROJETOS</text>
    
    <!-- Stat 3 -->
    <text x="360" y="30" font-family="sans-serif" font-size="32" font-weight="800" fill="#f0f0f0">4</text>
    <text x="360" y="55" font-family="monospace" font-size="14" fill="#666666" letter-spacing="1">STACKS</text>
  </g>
  
  <!-- Status indicator -->
  <circle cx="950" cy="520" r="8" fill="#1D9E75"/>
  <text x="970" y="528" font-family="monospace" font-size="16" fill="#1D9E75" letter-spacing="1">DISPONÍVEL PARA PROJETOS</text>
  
  <!-- Logo/Brand -->
  <g transform="translate(1050, 80)">
    <rect width="80" height="80" rx="12" fill="#111111" stroke="#222222" stroke-width="1"/>
    <text x="40" y="58" font-family="monospace" font-size="28" font-weight="700" fill="#7F77DD" text-anchor="middle">ms</text>
    <circle cx="68" cy="18" r="5" fill="#1D9E75"/>
  </g>
</svg>
