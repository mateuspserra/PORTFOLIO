<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Gerar OG Image</title>
</head>
<body style="margin: 0; padding: 20px; background: #111; color: #fff; font-family: monospace;">
    <h2>Instruções para gerar og-image.png:</h2>
    <ol>
        <li>Abra o arquivo <code>og-image.svg</code> no navegador</li>
        <li>Tire um screenshot (1200x630px)</li>
        <li>Salve como <code>og-image.png</code> na raiz do projeto</li>
    </ol>
    <p>Ou use uma ferramenta online como <a href="https://cloudconvert.com/svg-to-png" target="_blank" style="color: #7F77DD;">CloudConvert</a></p>
    <hr>
    <p><strong>Alternativa:</strong> Use o próprio og-image.svg (alguns sites aceitam SVG)</p>
</body>
</html>
